name: Sincronizar Buscaminas

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Descargar Buscaminas
        uses: actions/checkout@v6
        with:
          path: buscaminas

      - name: Descargar PokerOnline
        uses: actions/checkout@v6
        with:
          repository: Roberto-Villacorta/PokerOnline
          ref: main
          token: ${{ secrets.PORTAL_TOKEN }}
          path: portal

      - name: Actualizar Buscaminas
        run: |
          cp buscaminas/minas.css portal/BuscaMinasJS-main/minas.css
          cp buscaminas/minas.js portal/BuscaMinasJS-main/minas.js

      - name: Guardar cambios
        run: |
          cd portal

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add BuscaMinasJS-main/minas.css
          git add BuscaMinasJS-main/minas.js

          if git diff --cached --quiet; then
            echo "No hay cambios que sincronizar."
            exit 0
          fi

          git commit -m "chore: actualizar Buscaminas"

          git push origin main
